# SSH_AUTH_SOCK for everything that is not a shell.
#
# environment.d(5) is the systemd user manager's own environment, so user
# services inherit it -- and start-sway(1) evaluates the generator itself,
# under `set -o allexport`, before it sources /etc/sway/environment and
# ~/.config/sway/environment. The compositor and every app it launches
# therefore see the same agent the shells in scripts/30-ssh-agent.sh do,
# including the GUI git clients and editors that never source an rc file.
#
# ${XDG_RUNTIME_DIR} is expanded by systemd-environment-d-generator(8) from the
# environment it inherits, where pam_systemd has already set it. The %t of the
# socket unit is unit-file syntax and means nothing in this file.
#
# Shells set the same value for themselves, which is what covers an ssh login
# or a bare TTY -- no user manager environment reaches those.
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.socket
