# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set-option -g status-position top
set -g mouse on
set -g history-limit 50000
set -g display-time 4000
set -g default-terminal "xterm-256color"

# Make colors inside tmux match outside -- tmux/tmux#696
set -ga terminal-overrides ",xterm-256color:Tc"

set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -g status-interval 5

# Windows and sessions
bind x kill-pane
bind -r '<' previous-window
bind -r '>' next-window
bind -r ) switch-client -n
bind -r ( switch-client -p
bind r \
    source-file ~/.config/tmux/tmux.conf\; \
    display "tmux.conf sourced"
bind -r '[' swap-window -d -t -1
bind -r ']' swap-window -d -t +1

# Splits: the shifted pair inherits the current pane's path.
bind -r '\' split-window -h
bind -r '-' split-window -v
bind -r '|' split-window -h -c '#{pane_current_path}'
bind -r '_' split-window -v -c '#{pane_current_path}'

# Panes
bind -r C-Up resize-pane -U 5
bind -r C-Down resize-pane -D 5
bind -r C-Left resize-pane -L 5
bind -r C-Right resize-pane -R 5
bind -r Up select-pane -U
bind -r Down select-pane -D
bind -r Left select-pane -L
bind -r Right select-pane -R
bind -r C-k select-pane -U
bind -r C-j select-pane -D
bind -r C-h select-pane -L
bind -r C-l select-pane -R
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -r \; last-pane -Z
bind -r C new-window -c '#{pane_current_path}'

# The sleep is what makes clear-history take effect.
bind C-q \
    send-keys C-l\; \
    run 'sleep 0.1'\; \
    clear-history

# Plugins live beside this file rather than in TPM's ~/.tmux/plugins.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

set -g @plugin 'tmux-plugins/tpm'

# tmuxbar. Its plugin directory is a symlink to the working copy in
# ~/projects/personal/tmux, so prefix + U (TPM update) would `git pull` there.
set -g @plugin 'asinglebit/tmux'
set -g @tmuxbar-theme 'default'
set -g @tmuxbar-left-plugins "cwd"
set -g @tmuxbar-right-plugins "time"
# Keeps ghostty's own background on the theme, so the sub-cell remainder at
# the window edge does not sit at a stale colour.
set -g @tmuxbar-ghostty 'true'

# Keep at the very bottom.
run '~/.config/tmux/plugins/tpm/tpm'
