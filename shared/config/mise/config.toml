# mise global tool versions. Symlinked to ~/.config/mise/config.toml.
#
# OS-neutral on purpose: mise resolves the right build per platform, so this
# one file serves Linux and macOS. Anything machine-specific belongs in
# ~/.config/mise/config.local.toml, which mise layers ABOVE this file natively
# and which is deliberately not versioned.

[tools]
go   = "latest"
node = "lts"
pnpm = "latest"

# godot's version is Pay Per Paper's, not a preference: resolve_godot in its
# project scripts runs `godot --version` and refuses anything but 4.6.3 stable,
# on all three platforms.
#
# It has to be a HOST binary. A flatpak Godot -- Godots, or org.godotengine.Godot
# -- loads libcore_godot.so under its runtime's glibc, which trails the host's by
# a release or two. The extension is linked against the host's, so it fails to
# resolve (acosf@GLIBC_2.43 on Fedora 44) and takes every Core* class down with it.
#
# "4.6.3-stable" is the whole string -- that is how the aqua registry names
# Godot releases, and bare "4.6.3" does not resolve.
godot = "4.6.3-stable"

# rust is a rustup wrapper, not a replacement.
#
# mise's core:rust backend reports ~/.cargo/bin as the tool's bin path and
# selects the toolchain by exporting RUSTUP_TOOLCHAIN -- it installs rustup if
# absent and otherwise adopts the existing ~/.rustup in place. So rustup keeps
# doing everything it did: components, extra targets, nightly, cross-compiling.
# What this line adds is that the toolchain is now declared rather than being
# machine state.
#
# Consequences worth remembering:
#   - Do NOT set MISE_RUSTUP_HOME / MISE_CARGO_HOME. Leaving them unset is what
#     keeps mise on the standard ~/.rustup and ~/.cargo, so the existing
#     toolchain and the cargo registry cache are reused rather than duplicated.
#   - Components are reconciled on every `mise install`, so this list is
#     self-healing and reproduces the toolchain on a fresh machine.
#   - Cross-compile targets go in a project's own mise.toml as
#     targets = ["wasm32-unknown-unknown"], or via `rustup target add`. They are
#     left out here so we do not fetch a std for every target on every machine.
#   - If a project ever gains a rust-toolchain.toml, do NOT also declare rust in
#     that project's mise.toml: RUSTUP_TOOLCHAIN silently overrides the file.
rust = [
  { version = "stable", components = ["clippy", "rustfmt", "rust-analyzer", "rust-src"] },
  # Pay Per Paper's shipping toolchain. Its build scripts call it by name
  # (`cargo +1.98.1-<triple>`) and refuse to run if it is missing, so it has to
  # exist as its own rustup toolchain -- "stable" resolving to the same compiler
  # does not satisfy them. Listed second deliberately: mise takes the FIRST entry
  # as primary, so RUSTUP_TOOLCHAIN stays "stable" and this entry only guarantees
  # the toolchain is installed. Bare "1.98.1" is host-neutral, resolving to
  # 1.98.1-x86_64-unknown-linux-gnu on Linux and 1.98.1-aarch64-apple-darwin on
  # macOS -- which is what each platform's build.sh asks for.
  { version = "1.98.1" },
]

# Global CLI tools belong here as "npm:<pkg>" rather than in
# ~/.default-npm-packages, which mise starts warning about in 2026.11.0 and
# removes in 2027.11.0. The npm: backend also makes them independent of the
# node version, so a node bump does not orphan them.
#
# [tools]
# "npm:typescript" = "latest"

# .nvmrc / .node-version / rust-toolchain.toml are opt-in and left off -- no
# project here has one. Enable per tool with:
#   mise settings add idiomatic_version_file_enable_tools node
# Note this is NOT the `legacy_version_file` setting, which despite defaulting
# to true does not do this; it is the pre-rename asdf-compat knob.
