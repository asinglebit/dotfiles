# mise global tool versions, OS-neutral. Machine-specific pins go in
# ~/.config/mise/config.local.toml, which mise layers above this file.

[tools]
go   = "latest"
node = "lts"
pnpm = "latest"

# Pay Per Paper refuses anything but 4.6.3 stable, and needs a HOST binary: a
# flatpak Godot loads its GDExtension under an older glibc. Bare "4.6.3" does
# not resolve -- that is how the aqua registry names releases.
godot = "4.6.3-stable"

# Pinned to a MINOR: .blend files are forward-incompatible, so a scene saved by
# 5.3 will not reopen in 5.2. Host binary too -- the tarball reaches the NVIDIA
# driver directly for OptiX and CUDA, and mise runs it in place so the bundled
# python beside the executable stays findable.
blender = "5.2"

# core:rust IS rustup: it adopts ~/.rustup in place and picks the toolchain with
# RUSTUP_TOOLCHAIN, so rustup keeps working for components and targets. Do NOT
# set MISE_RUSTUP_HOME or MISE_CARGO_HOME, or the cargo cache is duplicated.
rust = [
  { version = "stable", components = ["clippy", "rustfmt", "rust-analyzer", "rust-src"] },
  # Pay Per Paper calls this one by name (`cargo +1.98.1-<triple>`). Second
  # because mise takes the first entry as primary, so RUSTUP_TOOLCHAIN stays
  # "stable".
  { version = "1.98.1" },
]
